name = "klassen-sammelpunkt"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "klassen-sammelpunkt"
database_id = "00000000-0000-0000-0000-000000000000"  # Platzhalter, Phase B: echte ID eintragen
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SICHERUNG"
bucket_name = "klassen-sammelpunkt-sicherung"

[triggers]
crons = ["30 2 * * *", "0 5 * * *"]   # 02:30 UTC R2-Sicherung, 05:00 UTC Sammelmeldung

[vars]
KLASSE = "abschlussklasse-2027"
ERLAUBTER_ORIGIN = "https://abschlussklasse-2027.github.io"
RATE_MAX = "20"
MAIL_ADAPTER = "konsole"      # konsole | resend
MAIL_AN = ""                  # Phase B: Empfaengeradresse
MAIL_VON = ""                 # Phase B: Absender (beim Anbieter verifiziert)
# Secrets (nie hier): ADMIN_TOKEN, MAIL_KEY, RATE_SALT. Lokal in .dev.vars.
