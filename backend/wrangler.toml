name = "abschlussklasse-2027"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "abschlussklasse-2027"
database_id = "2b838c95-f1cf-4094-92df-92773139a2aa"
migrations_dir = "migrations"

[triggers]
crons = ["0 5 * * *"]   # 05:00 UTC: alte Zaehler aufraeumen (keine Mails aus dem Worker)

[vars]
KLASSE = "abschlussklasse-2027"
ERLAUBTER_ORIGIN = "https://abschlussklasse-2027.github.io"
RATE_MAX = "20"               # Stimmen je Tag und Absender-Hash
TAGESMAX = "3000"             # Stimmen je Tag insgesamt (Free-Limit D1: 100 000 Schreibzeilen/Tag)
LINK_BASIS = "https://abschlussklasse-2027.github.io/steckbrief.html"  # Ziel der Magic Links
# Secrets (nie hier): ADMIN_TOKEN, RATE_SALT, STECKBRIEF_SECRET (mind. 16 Zeichen), optional MODERATION_KEY. Lokal in .dev.vars.
